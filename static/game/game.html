<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomb-Grid - Game</title>
  <link rel="stylesheet" href="/games-3d/static/game/game.css">
</head>
<body>
  <div id="ui">
    <div class="ui-top">
      <a class="menu-btn" href="/games-3d/">Home Menu</a>
      <h2 id="levelName">Loading…</h2>
      <div id="weaponBar" class="weapon-bar" data-weapon="cannon" role="group" aria-label="Weapons">
        <button type="button" class="weapon-slot is-active" data-slot="1" data-weapon="cannon" aria-pressed="true">
          <span class="weapon-key">1</span>
          <svg class="weapon-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M1.2 7.1h8.4v1.8H1.2z"/>
            <path fill="currentColor" d="M9.2 6h2.5v4H9.2z"/>
            <path fill="currentColor" d="M11.5 5.1h2.5v5.8h-2.5z"/>
            <circle cx="4" cy="11.7" r="1.35" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="8.1" cy="11.7" r="1.35" fill="none" stroke="currentColor" stroke-width="1.2"/>
          </svg>
          <span class="weapon-name">Cannon</span>
          <span class="weapon-ammo">∞</span>
        </button>
        <button type="button" class="weapon-slot" data-slot="2" data-weapon="machinegun" hidden aria-pressed="false">
          <span class="weapon-key">2</span>
          <svg class="weapon-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 8h12M3 8 13.2 3.1M3 8 13.2 12.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span class="weapon-name">Machine Gun</span>
          <span class="weapon-ammo">0</span>
        </button>
        <button type="button" class="weapon-slot" data-slot="3" data-weapon="nuke" hidden aria-pressed="false">
          <span class="weapon-key">3</span>
          <svg class="weapon-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="1.45" fill="currentColor"/>
            <path fill="currentColor" d="M8 1.6c.25 1.75 1.2 2.75 2.2 2.9-.4.6-1.25.9-2.2.9s-1.8-.3-2.2-.9c1-.15 1.95-1.15 2.2-2.9z"/>
            <path fill="currentColor" d="M8 1.6c.25 1.75 1.2 2.75 2.2 2.9-.4.6-1.25.9-2.2.9s-1.8-.3-2.2-.9c1-.15 1.95-1.15 2.2-2.9z" transform="rotate(120 8 8)"/>
            <path fill="currentColor" d="M8 1.6c.25 1.75 1.2 2.75 2.2 2.9-.4.6-1.25.9-2.2.9s-1.8-.3-2.2-.9c1-.15 1.95-1.15 2.2-2.9z" transform="rotate(240 8 8)"/>
          </svg>
          <span class="weapon-name">Nuke</span>
          <span class="weapon-ammo">1</span>
        </button>
        <button type="button" class="weapon-slot" data-slot="4" data-weapon="grenade" hidden aria-pressed="false">
          <span class="weapon-key">4</span>
          <svg class="weapon-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="9.4" r="3.15" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M9.3 6.8 12.2 3.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="12.7" cy="3.2" r="1.05" fill="currentColor"/>
          </svg>
          <span class="weapon-name">Grenade</span>
          <span class="weapon-ammo">0</span>
        </button>
        <button type="button" class="weapon-slot" data-slot="5" data-weapon="shield" hidden aria-pressed="false">
          <span class="weapon-key">5</span>
          <svg class="weapon-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 1.6 13.4 3.8v4.1c0 3.2-2.3 5.6-5.4 6.5-3.1-.9-5.4-3.3-5.4-6.5V3.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M8 4.6v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="weapon-name">Shield</span>
          <span class="weapon-ammo">0</span>
        </button>
        <button type="button" class="weapon-slot" data-slot="6" data-weapon="emp" hidden aria-pressed="false">
          <span class="weapon-key">6</span>
          <svg class="weapon-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="2" fill="currentColor"/>
            <circle cx="8" cy="8" r="4.6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <path d="M8 1.2v2M8 12.8v2M1.2 8h2M12.8 8h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="weapon-name">EMP</span>
          <span class="weapon-ammo">0</span>
        </button>
      </div>
      <div class="level-wrap">Lv <span id="tankLevel">1</span><span id="tankHpBonus"></span></div>
      <div class="lives-wrap" title="Lives"><span id="livesCounter">&#9829;&#9829;&#9829;</span></div>
      <div class="coin-wrap">Coins: <span id="coinCounter">0 / 0</span></div>
      <div class="time-wrap"><span id="levelTimer">0:00</span></div>
    </div>
    <div class="ui-hint">Arrows drive and turn · Space or click fires · 1-6 weapons</div>
  </div>
  <div id="sceneVignette" aria-hidden="true"></div>
  <div id="damageVignette" aria-hidden="true"></div>
  <canvas id="minimap" hidden></canvas>
  <div id="winPopup" hidden>
    <div class="popup-card">
      <h3>Level Complete</h3>
      <div id="winStars" class="stars" aria-label="Rating"></div>
      <p id="winMessage"></p>
      <p id="winDetails" class="popup-details"></p>
      <div class="popup-actions">
        <a class="menu-btn" href="/games-3d/">Back to Menu</a>
        <a id="nextLevelBtn" class="menu-btn" hidden>Next Level</a>
      </div>
    </div>
  </div>
  <div id="gameOverPopup" hidden>
    <div class="popup-card popup-card-danger">
      <h3>Game Over</h3>
      <p id="gameOverMessage">Turret fire destroyed the tank.</p>
      <div class="popup-actions">
        <a class="menu-btn" href="/games-3d/">Back to Menu</a>
        <button id="retryBtn" class="menu-btn" type="button">Retry Level</button>
      </div>
    </div>
  </div>
  <script type="module" src="/games-3d/static/game/game.js"></script>
</body>
</html>
